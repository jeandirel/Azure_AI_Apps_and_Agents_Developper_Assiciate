<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entraînement AI-103 — Azure AI Apps and Agents Developer Associate</title>
<style>
  :root {
    --azure: #0078d4;
    --azure-dark: #005a9e;
    --azure-light: #50b0f0;
    --bg: #f3f6fb;
    --card: #ffffff;
    --ink: #1b1a19;
    --muted: #605e5c;
    --line: #e1e5ea;
    --green: #107c10;
    --green-bg: #e6f4e6;
    --red: #d13438;
    --red-bg: #fde7e9;
    --amber: #c19c00;
    --amber-bg: #fff4ce;
    --shadow: 0 1.6px 3.6px rgba(0,0,0,.10), 0 .3px .9px rgba(0,0,0,.07);
    --shadow-lg: 0 6.4px 14.4px rgba(0,0,0,.13), 0 1.2px 3.6px rgba(0,0,0,.10);
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--azure-dark); }
  button { font-family: inherit; cursor: pointer; }

  /* Header */
  header {
    background: linear-gradient(120deg, var(--azure-dark), var(--azure));
    color: #fff;
    padding: 0;
    box-shadow: var(--shadow);
    position: sticky; top: 0; z-index: 50;
  }
  .nav {
    max-width: 1180px; margin: 0 auto;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 18px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .brand .logo {
    width: 34px; height: 34px; border-radius: 8px;
    background: rgba(255,255,255,.18);
    display: grid; place-items: center; font-weight: 700; font-size: 15px;
    border: 1px solid rgba(255,255,255,.35);
  }
  .brand h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .brand small { display: block; font-size: 11px; opacity: .85; font-weight: 400; }
  .nav-btn {
    background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.22);
    padding: 7px 13px; border-radius: 7px; font-size: 13px; font-weight: 500;
    transition: background .15s;
  }
  .nav-btn:hover { background: rgba(255,255,255,.26); }
  .nav-btn.active { background: #fff; color: var(--azure-dark); }

  main { max-width: 1180px; margin: 0 auto; padding: 22px 18px 60px; }
  .view { display: none; animation: fade .25s ease; }
  .view.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  h2.section-title { font-size: 22px; margin: 4px 0 4px; }
  .section-sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }

  /* Cards / grid */
  .grid { display: grid; gap: 16px; }
  .grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
  .grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 900px) { .grid.cols-4, .grid.cols-3 { grid-template-columns: repeat(2,1fr); } }
  @media (max-width: 600px) { .grid.cols-4, .grid.cols-3, .grid.cols-2 { grid-template-columns: 1fr; } }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow);
    transition: box-shadow .18s, transform .18s;
  }
  .card.hover:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }

  .stat { text-align: center; }
  .stat .num { font-size: 30px; font-weight: 700; color: var(--azure-dark); line-height: 1.1; }
  .stat .lbl { font-size: 12.5px; color: var(--muted); margin-top: 4px; }

  .btn {
    background: var(--azure); color: #fff; border: none; padding: 10px 18px;
    border-radius: 7px; font-size: 14px; font-weight: 600; transition: background .15s;
  }
  .btn:hover { background: var(--azure-dark); }
  .btn.secondary { background: #fff; color: var(--azure-dark); border: 1px solid var(--azure); }
  .btn.secondary:hover { background: #eaf3fc; }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .btn.ghost:hover { background: #f0f0f0; }
  .btn.danger { background: var(--red); }
  .btn.danger:hover { background: #a82c30; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.lg { padding: 13px 26px; font-size: 15px; }

  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .spacer { flex: 1; }

  /* Badges */
  .badge {
    display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 9px;
    border-radius: 20px; letter-spacing: .2px;
  }
  .badge.facile { background: var(--green-bg); color: var(--green); }
  .badge.intermédiaire { background: #e6f0fb; color: var(--azure-dark); }
  .badge.difficile { background: var(--red-bg); color: var(--red); }
  .badge.type { background: #f0eefb; color: #5b3fb0; }
  .badge.status-done { background: var(--green-bg); color: var(--green); }
  .badge.status-progress { background: var(--amber-bg); color: var(--amber); }
  .badge.status-new { background: #eef1f5; color: var(--muted); }

  .pill { display:inline-block; background:#eef3f9; color: var(--azure-dark); font-size:11.5px; padding:3px 9px; border-radius:6px; margin:2px 4px 2px 0; }

  /* Progress bar */
  .progress { background: #e7ebf0; border-radius: 20px; height: 9px; overflow: hidden; }
  .progress > span { display: block; height: 100%; background: linear-gradient(90deg, var(--azure-light), var(--azure)); border-radius: 20px; transition: width .4s; }

  .module-card h3 { margin: 2px 0 6px; font-size: 17px; }
  .module-card .desc { color: var(--muted); font-size: 13.5px; min-height: 40px; }
  .module-icon { width: 42px; height: 42px; border-radius: 9px; display:grid; place-items:center; font-size:20px; background:#eaf3fc; margin-bottom:8px; }

  .exam-row {
    display:flex; align-items:center; gap:12px; padding:11px 14px;
    border:1px solid var(--line); border-radius:8px; margin-bottom:9px; background:#fff;
    transition: background .15s;
  }
  .exam-row:hover { background:#f7fafd; }
  .exam-row .meta { flex:1; }
  .exam-row .meta b { font-size:14px; }
  .exam-row .meta small { color: var(--muted); display:block; font-size:12px; }

  /* Exam runner */
  .runner-top {
    display:flex; align-items:center; gap:14px; margin-bottom:16px; flex-wrap:wrap;
    background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:12px 16px; box-shadow: var(--shadow);
  }
  .timer { font-variant-numeric: tabular-nums; font-weight:700; font-size:17px; color: var(--azure-dark); }
  .timer.warn { color: var(--red); }
  .qcounter { font-size:13px; color: var(--muted); }

  .question-card { background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:22px; box-shadow: var(--shadow); }
  .qtext { font-size:17px; font-weight:600; margin:10px 0 6px; }
  .context-box {
    background:#f7fafd; border-left:4px solid var(--azure-light); padding:12px 14px;
    border-radius:6px; margin:12px 0; font-size:13.5px; color:#333; white-space:pre-wrap;
  }
  .context-box code, .qtext code, .opt-label code { background:#eef1f5; padding:1px 5px; border-radius:4px; font-family: Consolas, monospace; font-size:.92em; }
  pre.code { background:#1e1e1e; color:#dcdcdc; padding:14px; border-radius:8px; overflow:auto; font-size:13px; font-family: Consolas, monospace; margin:12px 0; }

  .options { margin:16px 0; display:flex; flex-direction:column; gap:10px; }
  .opt {
    display:flex; align-items:flex-start; gap:11px; border:1.5px solid var(--line);
    border-radius:9px; padding:12px 14px; cursor:pointer; transition: all .12s; background:#fff;
  }
  .opt:hover { border-color: var(--azure-light); background:#f7fafd; }
  .opt.selected { border-color: var(--azure); background:#eaf3fc; }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.incorrect { border-color: var(--red); background: var(--red-bg); }
  .opt input { margin-top:3px; }
  .opt-label { flex:1; font-size:14.5px; }
  .opt .marker { font-weight:700; margin-left:auto; font-size:13px; }
  .opt.correct .marker { color: var(--green); }
  .opt.incorrect .marker { color: var(--red); }

  /* ordering */
  .order-item { display:flex; align-items:center; gap:10px; border:1.5px solid var(--line); border-radius:9px; padding:10px 12px; margin-bottom:8px; background:#fff; }
  .order-item .num { width:24px; height:24px; border-radius:6px; background:var(--azure); color:#fff; display:grid; place-items:center; font-size:13px; font-weight:700; }
  .order-item .txt { flex:1; font-size:14px; }
  .order-item .arrows { display:flex; flex-direction:column; gap:2px; }
  .order-item .arrows button { border:1px solid var(--line); background:#f6f8fa; border-radius:5px; width:26px; height:20px; line-height:1; font-size:11px; padding:0; }
  .order-item .arrows button:hover { background:#e7ebf0; }

  .feedback { margin-top:18px; border-radius:9px; padding:16px; font-size:14px; animation: fade .2s; }
  .feedback.ok { background: var(--green-bg); border:1px solid #b5dfb5; }
  .feedback.ko { background: var(--red-bg); border:1px solid #f3c2c4; }
  .feedback h4 { margin:0 0 8px; font-size:15px; }
  .feedback .block { margin:10px 0; }
  .feedback .block b { display:block; font-size:12.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); margin-bottom:3px; }
  .tip { background: var(--amber-bg); border-left:4px solid var(--amber); padding:10px 12px; border-radius:6px; margin-top:8px; }
  .realworld { background:#eef3f9; border-left:4px solid var(--azure); padding:10px 12px; border-radius:6px; margin-top:8px; }

  .nav-q { display:flex; gap:10px; margin-top:20px; align-items:center; }

  /* Results */
  .score-hero { text-align:center; padding:30px 20px; }
  .score-ring {
    width:150px; height:150px; border-radius:50%; margin:0 auto 14px;
    display:grid; place-items:center; position:relative;
  }
  .score-ring .inner { width:118px; height:118px; background:#fff; border-radius:50%; display:grid; place-items:center; flex-direction:column; }
  .score-ring .pct { font-size:34px; font-weight:800; }
  .verdict { font-size:22px; font-weight:700; margin:6px 0; }
  .verdict.pass { color: var(--green); }
  .verdict.fail { color: var(--red); }

  .review-item { border:1px solid var(--line); border-radius:9px; margin-bottom:10px; overflow:hidden; }
  .review-item .head { display:flex; gap:10px; align-items:center; padding:12px 14px; cursor:pointer; }
  .review-item .head:hover { background:#f7fafd; }
  .review-item .head .ic { width:24px; height:24px; border-radius:50%; display:grid; place-items:center; color:#fff; font-size:13px; font-weight:700; flex-shrink:0; }
  .review-item .ic.ok { background: var(--green); }
  .review-item .ic.ko { background: var(--red); }
  .review-item .body { padding:0 14px 14px; display:none; }
  .review-item.open .body { display:block; }

  .empty { text-align:center; padding:50px 20px; color: var(--muted); }
  .empty .big { font-size:46px; margin-bottom:10px; }

  .toast {
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:#323130; color:#fff; padding:11px 20px; border-radius:8px; font-size:13.5px;
    box-shadow: var(--shadow-lg); z-index:100; opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .toast.show { opacity:1; }

  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; place-items:center; z-index:90; padding:18px; }
  .modal-bg.show { display:grid; }
  .modal { background:#fff; border-radius:12px; max-width:560px; width:100%; padding:24px; box-shadow:var(--shadow-lg); max-height:88vh; overflow:auto; }
  .modal h3 { margin-top:0; }
  textarea.json-in { width:100%; min-height:160px; font-family:Consolas,monospace; font-size:12.5px; border:1px solid var(--line); border-radius:8px; padding:10px; }

  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); margin-top:6px; }
  .legend span { display:inline-flex; align-items:center; gap:5px; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }

  footer { text-align:center; color:var(--muted); font-size:12px; padding:24px; }
  .skill-list { margin:8px 0 0; padding-left:18px; font-size:13px; color:#444; }
  .skill-list li { margin:3px 0; }
</style>
</head>
<body>
<header>
  <div class="nav">
    <div class="brand">
      <div class="logo">AI</div>
      <div>
        <h1>Entraînement AI-103</h1>
        <small>Azure AI Apps and Agents Developer Associate</small>
      </div>
    </div>
    <button class="nav-btn active" data-nav="home">Accueil</button>

</header>

<main>
  <!-- HOME -->
  <section class="view active" id="view-home"></section>

  <section class="view" id="view-modules"></section>
  <!-- MODULE DETAIL -->
  <section class="view" id="view-module"></section>
  <!-- FINALS -->
  <section class="view" id="view-finals"></section>
  <!-- EXAM RUNNER -->
  <section class="view" id="view-exam"></section>

  <section class="view" id="view-results"></section>

  <section class="view" id="view-review"></section>

  <section class="view" id="view-manage"></section>
</main>

<footer>
  Plateforme d'entraînement non officielle · Conçue pour la préparation à la certification AI-103 · Données stockées localement (localStorage)

<script>
/* =====================================================================
   AI-103 — Plateforme d'examens blancs
   Architecture : modules -> banque de questions -> examens (générés)
   Stockage : localStorage
   ===================================================================== */

/* -------------------- 1. MODULES -------------------- */
const modules = [
  {

    paths: 4,

      "Choisir les Foundry services et modèles (LLM, SLM, multimodal, Foundry Tools)",

      "Concevoir l'infrastructure, les options de déploiement et le CI/CD",
      "Gérer quotas, scaling, rate limits et coûts (Standard vs Provisioned Throughput)",

    skills: [
      "Extraire entités, topics, résumés et JSON structuré via generative prompting et Foundry Tools",
      "Détecter sentiment, tone, safety issues et contenu sensible",

  {
    id: "m5",
    icon: "📄",
    title: "Implement information extraction solutions",

    skills: [

      "Connecter les pipelines de retrieval aux workflows et aux tools d'agents",
      "Extraire le contenu documentaire (OCR + layout + field extraction) avec Content Understanding",
      "Produire des sorties structurées / markdown pour le raisonnement aval"

const moduleIndex = Object.fromEntries(modules.map(m => [m.id, m]));
const MODULE_EXAMS = 5;   // examens blancs par module
const FINAL_EXAMS = 10;   // examens finaux
const MODULE_Q = 25;      // questions cibles par examen module
const FINAL_Q = 50;       // questions cibles par examen final
const PASS = 70;          // seuil de réussite %
const DIFF_DIST = { facile: 0.20, intermédiaire: 0.50, difficile: 0.30 };

/* -------------------- 2. BANQUE DE QUESTIONS -------------------- */
/* answerKind : 'single' | 'multiple' | 'order'
   correctAnswers : indices (single/multiple) OU ordre attendu des index (order) */
const baseQuestions = [
  {
    "id": "m1q1",

    "difficulty": "facile",

    "explanation": "Un large language model (LLM) tel que gpt-4.1 est conçu pour le raisonnement complexe, les longues fenêtres de contexte et la génération de texte de haute qualité, ce qui correspond à un assistant conversationnel généraliste.",

    "tags": [
      "Microsoft Foundry",
      "LLM",
      "model selection"
    ]
  },
  {
    "id": "m1q2",
    "module": "m1",
    "type": "Étude de cas entreprise",
    "difficulty": "difficile",
    "answerKind": "single",
    "question": "Pour le scénario décrit, quel modèle minimise le coût et la latence tout en respectant la contrainte de déploiement on-device ?",
    "context": "Une entreprise industrielle veut classer en temps réel des messages courts de capteurs IoT directement sur des passerelles edge à connectivité limitée. Le volume est élevé, les réponses doivent être quasi instantanées, et le budget de calcul embarqué est restreint.",
    "options": [
      "gpt-4.1 déployé en Provisioned Throughput",
      "Un small language model (SLM) tel qu'un modèle Phi",
      "Un modèle multimodal GPT-4o",
      "o3 (reasoning model) en déploiement Standard"
    ],
    "correctAnswers": [
      1

/* -------------------- 4. GÉNÉRATION DES EXAMENS -------------------- */
/* PRNG déterministe (seedé) pour des examens stables */
function seeded(seedStr) {
  let h = 1779033703 ^ seedStr.length;
  for (let i = 0; i < seedStr.length; i++) {
    h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return function () {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  };
}
function shuffleSeed(arr, rng) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* Sélectionne des questions en respectant si possible la distribution de difficulté */
function pickQuestions(pool, target, seed) {
  const rng = seeded(seed);
  if (pool.length === 0) return [];
  const byDiff = { facile: [], intermédiaire: [], difficile: [] };
  pool.forEach(q => { (byDiff[q.difficulty] || byDiff.intermédiaire).push(q); });
  const chosen = [];
  const used = new Set();
  // 1) répartition par difficulté
  for (const d of Object.keys(DIFF_DIST)) {
    const want = Math.round(target * DIFF_DIST[d]);
    const list = shuffleSeed(byDiff[d], rng);
    for (let i = 0; i < want && i < list.length; i++) {
      chosen.push(list[i]); used.add(list[i].id);
    }
  }
  // 2) compléter avec le reste du pool jusqu'à la cible (sans dépasser le disponible)
  const rest = shuffleSeed(pool.filter(q => !used.has(q.id)), rng);
  let k = 0;
  while (chosen.length < target && k < rest.length) {
    chosen.push(rest[k]); used.add(rest[k].id); k++;
  }
  // plafonner exactement à la cible (l'arrondi de la distribution peut dépasser)
  const capped = chosen.slice(0, target);
  return shuffleSeed(capped, seeded(seed + "-final"));
}

/* Ordonne un pool en répartissant les difficultés de façon homogène (toute
   fenêtre contiguë respecte ~20/50/30), sans répétition. */
function stratifiedOrder(pool, seed) {
  const rng = seeded(seed);
  const b = { facile: [], intermédiaire: [], difficile: [] };
  pool.forEach(q => { (b[q.difficulty] || b.intermédiaire).push(q); });
  for (const k in b) b[k] = shuffleSeed(b[k], rng);
  const ptr = { facile: 0, intermédiaire: 0, difficile: 0 };
  const emitted = { facile: 0, intermédiaire: 0, difficile: 0 };
  const order = ["facile", "intermédiaire", "difficile"];
  const out = [];
  const total = pool.length;
  while (out.length < total) {
    let best = null, bestScore = -Infinity;
    for (const d of order) {
      if (ptr[d] >= b[d].length) continue;
      const score = DIFF_DIST[d] - (emitted[d] / (out.length + 1));
      if (score > bestScore) { bestScore = score; best = d; }
    }
    if (!best) break;
    out.push(b[best][ptr[best]++]); emitted[best]++;
  }
  return out;
}

/* Partitionne le pool en nExams examens de perExam questions chacun.
   Disjoints quand le pool est assez grand (≥ nExams*perExam) ; sinon on
   "boucle" sur l'ordre pour garder des examens de taille pleine (avec un
   minimum de recouvrement), tout en évitant les doublons au sein d'un examen. */
function makeExamSet(pool, nExams, perExam, seed) {
  const order = stratifiedOrder(pool, seed);
  const N = order.length;
  const result = [];
  for (let i = 0; i < nExams; i++) {
    const ids = [];
    const seen = new Set();
    let idx = i * perExam, guard = 0;
    while (N > 0 && ids.length < perExam && guard < perExam * 4) {
      const q = order[((idx % N) + N) % N];
      idx++; guard++;
      if (!seen.has(q.id)) { seen.add(q.id); ids.push(q.id); }
      else if (seen.size >= N) break; // pool plus petit que perExam
    }
    result.push(ids);
  }
  return result;
}

function buildExams() {
  exams = [];
  // Examens par module : 5 examens distincts par partitionnement du pool
  modules.forEach(m => {
    const pool = questions.filter(q => q.module === m.id);
    const sets = makeExamSet(pool, MODULE_EXAMS, MODULE_Q, m.id + "-mod");
    sets.forEach((ids, i) => exams.push({
      id: `${m.id}-ex${i + 1}`, kind: "module", module: m.id,
      title: `${m.short} — Examen blanc ${i + 1}`,
      target: MODULE_Q, questionIds: ids
    }));
  });
  // Examens finaux : 10 examens distincts mélangeant tous les modules
  const fsets = makeExamSet(questions, FINAL_EXAMS, FINAL_Q, "final-all");
  fsets.forEach((ids, i) => exams.push({
    id: `final-ex${i + 1}`, kind: "final", module: null,
    title: `Examen final blanc ${i + 1}`,
    target: FINAL_Q, questionIds: ids
  }));
}

const examIndex = () => Object.fromEntries(exams.map(e => [e.id, e]));
const qIndex = () => Object.fromEntries(questions.map(q => [q.id, q]));

function rebuildAll() {
  const imported = loadImportedQuestions();
  // fusion : base + importées (les importées peuvent écraser un id existant)
  const map = new Map();
  baseQuestions.forEach(q => map.set(q.id, q));
  imported.forEach(q => map.set(q.id, normalizeQuestion(q)));
  questions = Array.from(map.values());
  buildExams();
}

function normalizeQuestion(q) {
  // tolère des questions importées avec champs manquants
  return Object.assign({
    type: "QCM simple", difficulty: "intermédiaire", answerKind: "single",
    context: "", options: [], correctAnswers: [], explanation: "",
    wrongAnswersExplanation: "", examTip: "", realWorldExample: "", tags: []
  }, q);
}

/* -------------------- 5. STATISTIQUES -------------------- */
function moduleStats(moduleId) {
  const res = store.results.filter(r => r.module === moduleId);
  const done = new Set(res.map(r => r.examId)).size;
  const best = {};
  res.forEach(r => { if (!best[r.examId] || r.pct > best[r.examId]) best[r.examId] = r.pct; });
  const pcts = Object.values(best);
  const avg = pcts.length ? Math.round(pcts.reduce((a, b) => a + b, 0) / pcts.length) : 0;
  let status = "Non commencé";
  if (done >= MODULE_EXAMS) status = "Terminé";
  else if (done > 0) status = "En cours";
  return { done, total: MODULE_EXAMS, avg, status, attempts: res.length };
}

function globalStats() {
  const res = store.results;
  const finished = res.length;
  const avg = finished ? Math.round(res.reduce((a, r) => a + r.pct, 0) / finished) : 0;
  const strong = [], weak = [];
  modules.forEach(m => {
    const s = moduleStats(m.id);
    if (s.attempts > 0) {
      if (s.avg >= 80) strong.push(m);
      else if (s.avg < PASS) weak.push(m);
    }
  });
  return { finished, avg, strong, weak };
}

function errorCount() {
  return Object.values(store.errors).filter(e => e.count > 0).length;
}

  });
});

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
/* inline code/markdown léger : `code` */
function fmt(s) {
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
}

/* -------------------- 7. MOTEUR D'EXAMEN -------------------- */
function startExam(examId, mode) {
  const ex = examIndex()[examId];
  if (!ex || ex.questionIds.length === 0) { toast("Aucune question disponible pour cet examen."); return; }
  const qi = qIndex();
  runtime = {
    ex, mode,                 // mode: 'exam' | 'training'
    qids: ex.questionIds.slice(),
    qmap: qi,
    idx: 0,
    answers: {},              // qid -> array of selected indices (or order)
    checked: {},              // qid -> bool (training: déjà corrigé)
    startTime: Date.now(),
    timer: null
  };
  if (mode === "exam") startTimer();
  renderExamQuestion();
  nav("exam");
}

function startTimer() {
  const total = runtime.qids.length * 90; // 90s par question
  runtime.remaining = total;
  runtime.timer = setInterval(() => {
    runtime.remaining--;
    const t = document.getElementById("timer");
    if (t) {
      t.textContent = fmtTime(runtime.remaining);
      t.classList.toggle("warn", runtime.remaining <= 60);
    }
    if (runtime.remaining <= 0) { clearInterval(runtime.timer); finishExam(true); }
  }, 1000);
}
function fmtTime(s) {
  s = Math.max(0, s);
  const m = Math.floor(s / 60), sec = s % 60;
  return `${m}:${String(sec).padStart(2, "0")}`;
}

function renderExamQuestion() {
  const r = runtime;
  const qid = r.qids[r.idx];
  const q = r.qmap[qid];
  const sel = r.answers[qid] || [];
  const isChecked = r.mode === "training" && r.checked[qid];
  const el = document.getElementById("view-exam");

  let optionsHtml = "";
  if (q.answerKind === "order") {
    // ordre actuel : on garde l'état dans r.answers[qid] (liste d'index)
    let order = r.answers[qid];
    if (!order) { order = q.options.map((_, i) => i); r.answers[qid] = order; }
    optionsHtml = `<div class="options" id="order-zone">${order.map((optIdx, pos) => `
      <div class="order-item" data-pos="${pos}">
        <span class="num">${pos + 1}</span>
        <span class="txt">${fmt(q.options[optIdx])}</span>
        <span class="arrows">
          <button data-move="up" data-pos="${pos}" ${pos === 0 ? "disabled" : ""}>▲</button>
          <button data-move="down" data-pos="${pos}" ${pos === order.length - 1 ? "disabled" : ""}>▼</button>
        </span>
      </div>`).join("")}</div>`;
  } else {
    const multi = q.answerKind === "multiple";
    optionsHtml = `<div class="options">${q.options.map((opt, i) => {
      let cls = "opt";
      const chosen = sel.includes(i);
      if (chosen && !isChecked) cls += " selected";
      if (isChecked) {
        if (q.correctAnswers.includes(i)) cls += " correct";
        else if (chosen) cls += " incorrect";
      }
      let marker = "";
      if (isChecked) {
        if (q.correctAnswers.includes(i)) marker = `<span class="marker">✔ correcte</span>`;
        else if (chosen) marker = `<span class="marker">✘ votre choix</span>`;
      }
      return `<label class="${cls}">
        <input type="${multi ? "checkbox" : "radio"}" name="opt" value="${i}" ${chosen ? "checked" : ""} ${isChecked ? "disabled" : ""}/>
        <span class="opt-label">${fmt(opt)}</span>${marker}
      </label>`;
    }).join("")}</div>`;
  }

  const answeredCount = r.qids.filter(id => (r.answers[id] && r.answers[id].length && r.qmap[id].answerKind !== "order") || (r.qmap[id].answerKind === "order")).length;

  el.innerHTML = `
    <div class="runner-top">
      <div>
        <b>${esc(r.ex.title)}</b>
        <div class="qcounter">Question ${r.idx + 1} / ${r.qids.length} · ${r.mode === "exam" ? "Mode examen" : "Mode entraînement"}</div>
      </div>
      <span class="spacer"></span>
      ${r.mode === "exam" ? `<div class="timer" id="timer">${fmtTime(r.remaining)}</div>` : `<span class="badge type">Correction immédiate</span>`}
      <button class="btn ghost" id="quit-exam">Quitter</button>
    </div>

    <div class="progress" style="margin-bottom:16px;"><span style="width:${((r.idx + 1) / r.qids.length) * 100}%"></span></div>

    <div class="question-card">
      <div class="row" style="gap:6px;">
        <span class="badge ${q.difficulty}">${q.difficulty}</span>
        <span class="badge type">${esc(q.type)}</span>
        ${moduleIndex[q.module] ? `<span class="badge status-new">${esc(moduleIndex[q.module].short)}</span>` : ""}
        ${q.answerKind === "multiple" ? `<span class="badge status-progress">Plusieurs réponses</span>` : ""}
        ${q.answerKind === "order" ? `<span class="badge status-progress">Ordre logique</span>` : ""}
      </div>
      <div class="qtext">${fmt(q.question)}</div>
      ${q.context ? `<div class="context-box">${fmt(q.context)}</div>` : ""}
      ${q.code ? `<pre class="code">${esc(q.code)}</pre>` : ""}
      ${optionsHtml}
      <div id="feedback-zone"></div>
      <div class="nav-q">
        <button class="btn ghost" id="prev-q" ${r.idx === 0 ? "disabled" : ""}>← Précédent</button>
        ${r.mode === "training" && !isChecked ? `<button class="btn" id="check-q">Valider ma réponse</button>` : ""}
        <span class="spacer"></span>
        ${r.idx < r.qids.length - 1
          ? `<button class="btn" id="next-q">Suivant →</button>`
          : `<button class="btn" id="finish-q" style="background:var(--green);">Terminer l'examen</button>`}
      </div>
    </div>
  `;

  // bindings
  if (q.answerKind === "order") {
    el.querySelectorAll("[data-move]").forEach(btn => btn.addEventListener("click", () => {
      const pos = parseInt(btn.dataset.pos, 10);
      const dir = btn.dataset.move;
      const order = r.answers[qid];
      const swap = dir === "up" ? pos - 1 : pos + 1;
      if (swap < 0 || swap >= order.length) return;
      [order[pos], order[swap]] = [order[swap], order[pos]];
      renderExamQuestion();
    }));
  } else if (!isChecked) {
    el.querySelectorAll('input[name="opt"]').forEach(inp => inp.addEventListener("change", () => {
      const multi = q.answerKind === "multiple";
      if (multi) {
        const chosen = Array.from(el.querySelectorAll('input[name="opt"]:checked')).map(x => parseInt(x.value, 10));
        r.answers[qid] = chosen;
      } else {
        r.answers[qid] = [parseInt(inp.value, 10)];
      }
      // refléter la sélection visuelle sans recharger
      el.querySelectorAll(".opt").forEach((o, i) => o.classList.toggle("selected", (r.answers[qid] || []).includes(i)));
    }));
  }
  if (isChecked) showFeedback(q);

  const prev = el.querySelector("#prev-q"); if (prev) prev.addEventListener("click", () => { r.idx--; renderExamQuestion(); });
  const next = el.querySelector("#next-q"); if (next) next.addEventListener("click", () => { r.idx++; renderExamQuestion(); });
  const fin = el.querySelector("#finish-q"); if (fin) fin.addEventListener("click", () => confirmFinish());
  const chk = el.querySelector("#check-q"); if (chk) chk.addEventListener("click", () => {
    if (!hasAnswer(q, r.answers[qid])) { toast("Sélectionnez une réponse d'abord."); return; }
    r.checked[qid] = true; renderExamQuestion();
  });
  el.querySelector("#quit-exam").addEventListener("click", () => {
    if (confirm("Quitter l'examen ? Votre progression sur cet examen sera perdue.")) {
      if (r.timer) clearInterval(r.timer);
      runtime = null; renderHome(); nav("home");
    }
  });
}

function hasAnswer(q, ans) {
  if (q.answerKind === "order") return true; // toujours un ordre
  return ans && ans.length > 0;
}

function isCorrect(q, ans) {
  if (!ans) return false;
  if (q.answerKind === "order") {
    return ans.length === q.correctAnswers.length && ans.every((v, i) => v === q.correctAnswers[i]);
  }
  const a = [...ans].sort((x, y) => x - y);
  const b = [...q.correctAnswers].sort((x, y) => x - y);
  return a.length === b.length && a.every((v, i) => v === b[i]);
}

function showFeedback(q) {
  const r = runtime;
  const ans = r.answers[r.qids[r.idx]];
  const ok = isCorrect(q, ans);
  const zone = document.getElementById("feedback-zone");
  if (!zone) return;
  zone.innerHTML = `
    <div class="feedback ${ok ? "ok" : "ko"}">
      <h4>${ok ? "✅ Bonne réponse !" : "❌ Réponse incorrecte"}</h4>
      <div class="block"><b>Explication</b>${fmt(q.explanation)}</div>
      ${q.wrongAnswersExplanation ? `<div class="block"><b>Pourquoi les autres réponses sont fausses</b>${fmt(q.wrongAnswersExplanation)}</div>` : ""}
      ${q.examTip ? `<div class="tip"><b>💡 Astuce examen</b><br>${fmt(q.examTip)}</div>` : ""}
      ${q.realWorldExample ? `<div class="realworld"><b>🏢 Cas réel entreprise</b><br>${fmt(q.realWorldExample)}</div>` : ""}
      ${q.tags && q.tags.length ? `<div style="margin-top:10px;">${q.tags.map(t => `<span class="pill">${esc(t)}</span>`).join("")}</div>` : ""}
    </div>`;
}

function confirmFinish() {
  const r = runtime;
  const unanswered = r.qids.filter(id => r.qmap[id].answerKind !== "order" && !hasAnswer(r.qmap[id], r.answers[id])).length;
  let msg = "Terminer l'examen et voir la correction ?";
  if (unanswered > 0) msg = `${unanswered} question(s) sans réponse. Terminer quand même ?`;
  if (confirm(msg)) finishExam(false);
}

function finishExam(timeUp) {
  const r = runtime;
  if (r.timer) clearInterval(r.timer);
  let correct = 0;
  const answersMap = {};
  r.qids.forEach(id => {
    const q = r.qmap[id];
    const ok = isCorrect(q, r.answers[id]);
    answersMap[id] = ok;
    if (ok) correct++;
    else {
      // enregistrer l'erreur
      if (!store.errors[id]) store.errors[id] = { count: 0 };
      store.errors[id].count++;
      store.errors[id].lastWrong = new Date().toISOString();
    }
    // si réussi et présent dans les erreurs, on décrémente (révision réussie)
    if (ok && store.errors[id] && store.errors[id].count > 0) {
      store.errors[id].count = Math.max(0, store.errors[id].count - 1);
    }
  });
  const total = r.qids.length;
  const pct = total ? Math.round((correct / total) * 100) : 0;
  const result = {
    examId: r.ex.id, title: r.ex.title, kind: r.ex.kind, module: r.ex.module,
    score: correct, total, pct, pass: pct >= PASS,
    mode: r.mode, timeUp: !!timeUp,
    date: new Date().toISOString(), answers: answersMap
  };
  store.results.push(result);
  saveStore();
  renderResults(result, r);
  nav("results");
}

/* ---------- RESULTS ---------- */
function renderResults(result, r) {
  const el = document.getElementById("view-results");
  const pass = result.pass;
  const color = pass ? "var(--green)" : "var(--red)";
  const ringDeg = result.pct * 3.6;

  // modules faibles dans cet examen
  const moduleScores = {};
  r.qids.forEach(id => {
    const q = r.qmap[id];
    moduleScores[q.module] = moduleScores[q.module] || { ok: 0, tot: 0 };
    moduleScores[q.module].tot++;
    if (result.answers[id]) moduleScores[q.module].ok++;
  });
  const weakModules = Object.entries(moduleScores)
    .filter(([m, s]) => (s.ok / s.tot) < 0.7)
    .map(([m]) => moduleIndex[m]).filter(Boolean);

  // concepts à revoir (tags des questions ratées)
  const weakTags = {};
  r.qids.forEach(id => {
    if (!result.answers[id]) (r.qmap[id].tags || []).forEach(t => weakTags[t] = (weakTags[t] || 0) + 1);
  });
  const topTags = Object.entries(weakTags).sort((a, b) => b[1] - a[1]).slice(0, 8).map(x => x[0]);

  const advice = buildAdvice(result, weakModules, topTags);

  el.innerHTML = `
    <div class="card score-hero">
      ${result.timeUp ? `<div class="badge status-progress" style="margin-bottom:10px;">⏰ Temps écoulé</div>` : ""}
      <div class="score-ring" style="background:conic-gradient(${color} ${ringDeg}deg, #e7ebf0 0deg);">
        <div class="inner" style="flex-direction:column;">
          <div class="pct" style="color:${color};">${result.pct}%</div>
          <small style="color:var(--muted);">${result.score}/${result.total}</small>
        </div>
      </div>
      <div class="verdict ${pass ? "pass" : "fail"}">${pass ? "✅ Réussi" : "📌 À revoir"}</div>
      <p style="color:var(--muted);margin:0;">${esc(result.title)} · seuil de réussite ${PASS}%</p>
      <div class="row" style="justify-content:center;margin-top:16px;">
        <button class="btn" id="retry">Recommencer cet examen</button>
        <button class="btn secondary" id="to-home">Tableau de bord</button>
      </div>
    </div>

    <div class="grid cols-3" style="margin:20px 0;">
      <div class="card stat"><div class="num" style="color:var(--green);">${result.score}</div><div class="lbl">Réussies</div></div>
      <div class="card stat"><div class="num" style="color:var(--red);">${result.total - result.score}</div><div class="lbl">Ratées</div></div>
      <div class="card stat"><div class="num">${result.pct}%</div><div class="lbl">Pourcentage</div></div>
    </div>

    ${weakModules.length ? `<div class="card" style="border-left:4px solid var(--amber);margin-bottom:14px;">
      <b>Modules faibles sur cet examen</b><br>${weakModules.map(m => `<span class="pill">${esc(m.short)}</span>`).join("")}
    </div>` : ""}
    ${topTags.length ? `<div class="card" style="border-left:4px solid var(--azure);margin-bottom:14px;">
      <b>Notions à revoir</b><br>${topTags.map(t => `<span class="pill">${esc(t)}</span>`).join("")}
    </div>` : ""}
    <div class="card" style="margin-bottom:18px;">
      <b>📋 Conseils personnalisés</b>
      <ul class="skill-list">${advice.map(a => `<li>${esc(a)}</li>`).join("")}</ul>
    </div>

    <h3>Correction complète</h3>
    <div id="review-list">${r.qids.map((id, i) => reviewItem(r.qmap[id], result.answers[id], r.answers[id], i)).join("")}</div>
  `;

  el.querySelector("#retry").addEventListener("click", () => startExam(result.examId, r.mode));
  el.querySelector("#to-home").addEventListener("click", () => { renderHome(); nav("home"); });
  bindReviewItems(el);
}

function buildAdvice(result, weakModules, topTags) {
  const a = [];
  if (result.pass) a.push("Bon score ! Consolidez en refaisant un examen final pour valider votre régularité.");
  else a.push(`Score sous le seuil de ${PASS}%. Reprenez les explications des questions ratées avant de réessayer.`);
  if (weakModules.length) a.push(`Concentrez-vous sur : ${weakModules.map(m => m.title).join(", ")}.`);
  if (topTags.length) a.push(`Révisez ces notions clés : ${topTags.slice(0, 5).join(", ")}.`);
  a.push("Utilisez le mode Entraînement pour obtenir la correction immédiate après chaque question.");
  a.push("Consultez 'Réviser mes erreurs' pour retravailler uniquement vos questions ratées.");
  return a;
}

function reviewItem(q, ok, userAns, i) {
  const userTxt = formatUserAnswer(q, userAns);
  const correctTxt = formatCorrectAnswer(q);
  return `<div class="review-item">
    <div class="head">
      <div class="ic ${ok ? "ok" : "ko"}">${ok ? "✓" : "✗"}</div>
      <div style="flex:1;"><b>Q${i + 1}.</b> ${fmt(q.question)}</div>
      <span class="badge ${q.difficulty}">${q.difficulty}</span>
    </div>
    <div class="body">
      ${q.context ? `<div class="context-box">${fmt(q.context)}</div>` : ""}
      ${q.code ? `<pre class="code">${esc(q.code)}</pre>` : ""}
      <p style="margin:6px 0;"><b>Votre réponse :</b> <span style="color:${ok ? "var(--green)" : "var(--red)"};">${userTxt}</span></p>
      <p style="margin:6px 0;"><b>Bonne réponse :</b> <span style="color:var(--green);">${correctTxt}</span></p>
      <div class="feedback ${ok ? "ok" : "ko"}" style="margin-top:8px;">
        <div class="block"><b>Explication</b>${fmt(q.explanation)}</div>
        ${q.wrongAnswersExplanation ? `<div class="block"><b>Pourquoi les autres sont fausses</b>${fmt(q.wrongAnswersExplanation)}</div>` : ""}
        ${q.examTip ? `<div class="tip"><b>💡 Astuce examen</b><br>${fmt(q.examTip)}</div>` : ""}
        ${q.realWorldExample ? `<div class="realworld"><b>🏢 Cas réel</b><br>${fmt(q.realWorldExample)}</div>` : ""}
      </div>
    </div>
  </div>`;
}

function formatUserAnswer(q, userAns) {
  if (!userAns || (q.answerKind !== "order" && !userAns.length)) return "(aucune réponse)";
  if (q.answerKind === "order") return userAns.map((idx, p) => `${p + 1}. ${esc(stripCode(q.options[idx]))}`).join(" · ");
  return userAns.map(i => esc(stripCode(q.options[i]))).join(" ; ");
}
function formatCorrectAnswer(q) {
  if (q.answerKind === "order") return q.correctAnswers.map((idx, p) => `${p + 1}. ${esc(stripCode(q.options[idx]))}`).join(" · ");
  return q.correctAnswers.map(i => esc(stripCode(q.options[i]))).join(" ; ");
}
function stripCode(s) { return String(s).replace(/`/g, ""); }

function bindReviewItems(scope) {
  scope.querySelectorAll(".review-item .head").forEach(h => h.addEventListener("click", () => {
    h.parentElement.classList.toggle("open");
  }));
}

/* ---------- REVIEW ERRORS ---------- */
function renderReview() {
  const el = document.getElementById("view-review");
  const wrongIds = Object.entries(store.errors).filter(([id, e]) => e.count > 0).map(([id]) => id);
  const qi = qIndex();
  const list = wrongIds.map(id => qi[id]).filter(Boolean);

  if (list.length === 0) {
    el.innerHTML = `<h2 class="section-title">Réviser mes erreurs</h2>
      <div class="empty"><div class="big">🎉</div><b>Aucune erreur à réviser !</b>
      <p>Terminez des examens : les questions ratées apparaîtront ici pour révision ciblée.</p>
      <button class="btn" id="go-mods">Commencer un examen</button></div>`;
    el.querySelector("#go-mods").addEventListener("click", () => { renderModules(); nav("modules"); });
    return;
  }

  el.innerHTML = `
    <h2 class="section-title">Réviser mes erreurs</h2>
    <p class="section-sub">${list.length} question(s) ratée(s). Relancez une session de révision ou consultez les corrections.</p>
    <div class="row" style="margin-bottom:16px;">
      <button class="btn lg" id="start-review">▶️ Lancer une révision (mode entraînement)</button>
      <button class="btn ghost" id="clear-errors">Effacer mes erreurs</button>
    </div>
    <div id="rev-list">${list.map((q, i) => reviewItem(q, false, null, i)).join("")}</div>
  `;
  el.querySelector("#start-review").addEventListener("click", () => startReviewSession(wrongIds));
  el.querySelector("#clear-errors").addEventListener("click", () => {
    if (confirm("Effacer toutes les erreurs enregistrées ?")) { store.errors = {}; saveStore(); renderReview(); }
  });
  bindReviewItems(el);
}

function startReviewSession(ids) {
  const qi = qIndex();
  const valid = ids.filter(id => qi[id]);
  if (!valid.length) { toast("Aucune question à réviser."); return; }
  runtime = {
    ex: { id: "review-session", title: "Révision de mes erreurs", kind: "review", module: null, questionIds: valid, target: valid.length },
    mode: "training", qids: valid.slice(), qmap: qi, idx: 0, answers: {}, checked: {}, startTime: Date.now(), timer: null
  };
  renderExamQuestion();
  nav("exam");
}

/* ---------- MANAGE / IMPORT ---------- */
function renderManage() {
  const el = document.getElementById("view-manage");
  const imported = loadImportedQuestions();
  el.innerHTML = `
    <h2 class="section-title">Gérer les questions & la progression</h2>
    <p class="section-sub">Banque actuelle : ${questions.length} questions (${baseQuestions.length} de base + ${imported.length} importées).</p>

    <div class="card" style="margin-bottom:16px;">
      <h3 style="margin-top:0;">📥 Importer des questions (JSON)</h3>
      <p style="color:var(--muted);font-size:13.5px;">Collez un tableau JSON de questions ou chargez un fichier <code>.json</code>. Les examens se reconstruisent automatiquement. Champs requis : <code>id, module, question, options, correctAnswers</code>.</p>
      <input type="file" id="json-file" accept="application/json,.json" />
      <textarea class="json-in" id="json-text" placeholder='[{"id":"x1","module":"m1","type":"QCM simple","difficulty":"facile","answerKind":"single","question":"...","options":["A","B"],"correctAnswers":[0],"explanation":"...","tags":["..."]}]'></textarea>
      <div class="row" style="margin-top:10px;">
        <button class="btn" id="import-btn">Importer</button>
        <button class="btn secondary" id="show-schema">Voir le format / exemple</button>
        <button class="btn ghost" id="export-base">Exporter la banque de base</button>
        ${imported.length ? `<button class="btn danger" id="clear-imported">Supprimer les importées</button>` : ""}
      </div>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <h3 style="margin-top:0;">🗂️ Examens disponibles</h3>
      <p style="color:var(--muted);font-size:13.5px;">${exams.filter(e=>e.kind==='module').length} examens de module + ${exams.filter(e=>e.kind==='final').length} examens finaux. Chaque examen vise ${MODULE_Q} (module) / ${FINAL_Q} (final) questions ; ajoutez des questions pour atteindre la cible.</p>
      <div class="legend">
        <span><span class="dot" style="background:var(--green);"></span> facile 20%</span>
        <span><span class="dot" style="background:var(--azure);"></span> intermédiaire 50%</span>
        <span><span class="dot" style="background:var(--red);"></span> difficile 30%</span>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">⚙️ Données & progression</h3>
      <p style="color:var(--muted);font-size:13.5px;">Examens terminés : ${store.results.length} · Erreurs enregistrées : ${errorCount()}</p>
      <div class="row">
        <button class="btn secondary" id="export-progress">Exporter ma progression</button>
        <button class="btn danger" id="reset-progress">Réinitialiser toute la progression</button>
      </div>
    </div>
  `;

  el.querySelector("#json-file").addEventListener("change", (e) => {
    const f = e.target.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => { document.getElementById("json-text").value = reader.result; };
    reader.readAsText(f);
  });
  el.querySelector("#import-btn").addEventListener("click", () => doImport(document.getElementById("json-text").value));
  el.querySelector("#show-schema").addEventListener("click", showSchema);
  el.querySelector("#export-base").addEventListener("click", () => download("ai103-banque-base.json", JSON.stringify(baseQuestions, null, 2)));
  el.querySelector("#export-progress").addEventListener("click", () => download("ai103-progression.json", JSON.stringify(store, null, 2)));
  el.querySelector("#reset-progress").addEventListener("click", () => {
    if (confirm("Réinitialiser toute la progression (scores, erreurs, historique) ?")) {
      store = { results: [], moduleProgress: {}, errors: {} }; saveStore(); renderManage(); toast("Progression réinitialisée.");
    }
  });
  const ci = el.querySelector("#clear-imported");
  if (ci) ci.addEventListener("click", () => {
    if (confirm("Supprimer toutes les questions importées ?")) { saveImportedQuestions([]); rebuildAll(); renderManage(); toast("Questions importées supprimées."); }
  });
}

function doImport(text) {
  if (!text || !text.trim()) { toast("Collez du JSON ou chargez un fichier."); return; }
  let data;
  try { data = JSON.parse(text); } catch (e) { toast("JSON invalide : " + e.message); return; }
  if (!Array.isArray(data)) data = data.questions || [data];
  const valid = [], errors = [];
  data.forEach((q, i) => {
    if (!q.id || !q.module || !q.question || !Array.isArray(q.options) || !Array.isArray(q.correctAnswers)) {
      errors.push(i); return;
    }
    if (!moduleIndex[q.module]) { errors.push(i); return; }
    valid.push(normalizeQuestion(q));
  });
  if (!valid.length) { toast("Aucune question valide trouvée (vérifiez id, module, options, correctAnswers)."); return; }
  const existing = loadImportedQuestions();
  const map = new Map(existing.map(q => [q.id, q]));
  valid.forEach(q => map.set(q.id, q));
  saveImportedQuestions(Array.from(map.values()));
  rebuildAll();
  renderManage();
  toast(`${valid.length} question(s) importée(s)${errors.length ? `, ${errors.length} ignorée(s)` : ""}.`);
}

  const example = {
    id: "m1q99",

    difficulty: "intermédiaire",
    answerKind: "single",
    question: "Quel service... ?",

    options: ["Option A", "Option B", "Option C", "Option D"],

  };
  openModal(`

      <b>difficulty</b> : "facile" · "intermédiaire" · "difficile"<br>
      <b>answerKind</b> : "single" (une réponse) · "multiple" (plusieurs) · "order" (ordre logique ; correctAnswers = ordre des index)<br>
      <b>correctAnswers</b> : tableau d'index (commence à 0).
    </p>
    <pre class="code">${esc(JSON.stringify([example], null, 2))}</pre>
    <div class="row"><span class="spacer"></span><button class="btn" id="close-modal">Fermer</button></div>
  `);
}

/* -------------------- 8. UTILITAIRES UI -------------------- */
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}
function openModal(html) {
  const bg = document.getElementById("modal-bg");
  document.getElementById("modal").innerHTML = html;
  bg.classList.add("show");
  const close = document.getElementById("close-modal");
  if (close) close.addEventListener("click", () => bg.classList.remove("show"));
  bg.onclick = (e) => { if (e.target === bg) bg.classList.remove("show"); };
}
function download(name, content) {
  const blob = new Blob([content], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; a.click();
  URL.revokeObjectURL(url);
}

/* -------------------- 9. INIT -------------------- */
rebuildAll();
renderHome();
</script>
